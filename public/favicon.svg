<svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="so-fav-bg" x1="18" y1="2" x2="18" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b172b" />
      <stop offset="50%" stop-color="#07101e" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="so-fav-edge" x1="4" y1="3" x2="32" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.7" />
      <stop offset="75%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="so-fav-cyan" x1="8" y1="9" x2="28" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="so-fav-blue" x1="28" y1="27" x2="8" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <filter id="so-fav-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Tactical Hex-Aegis Shell -->
  <path
    d="M18 2.5 L31 7.2 V18.5 C31 25.8 25.2 31.2 18 33.5 C10.8 31.2 5 25.8 5 18.5 V7.2 L18 2.5 Z"
    fill="url(#so-fav-bg)"
    stroke="url(#so-fav-edge)"
    stroke-width="1.4"
    stroke-linejoin="round"
  />

  <!-- 2. Precision Reticle Marks -->
  <line x1="18" y1="4.5" x2="18" y2="7.5" stroke="#22d3ee" stroke-width="1.2" stroke-linecap="round" />
  <line x1="18" y1="28.5" x2="18" y2="31.5" stroke="#3b82f6" stroke-width="1.2" stroke-linecap="round" />
  <line x1="7" y1="18" x2="10" y2="18" stroke="#06b6d4" stroke-width="1.2" stroke-linecap="round" />
  <line x1="26" y1="18" x2="29" y2="18" stroke="#06b6d4" stroke-width="1.2" stroke-linecap="round" />

  <!-- 3. Radar Sweep Arc -->
  <path
    d="M10.5 15 A8.5 8.5 0 0 1 25.5 15"
    stroke="#06b6d4"
    stroke-opacity="0.35"
    stroke-width="1.2"
    stroke-dasharray="2.5 2"
    stroke-linecap="round"
  />

  <!-- 4. Upper Signal Blade ('S' top curve) -->
  <path
    d="M26 10.5 H16.2 C13.5 10.5 11.5 12.2 11.5 14.8 C11.5 17.5 13.8 19 16.5 19.4 L19.2 19.8"
    stroke="url(#so-fav-cyan)"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 5. Lower Signal Blade ('S' bottom curve) -->
  <path
    d="M10 25.5 H19.8 C22.5 25.5 24.5 23.8 24.5 21.2 C24.5 18.5 22.2 17 19.5 16.6 L16.8 16.2"
    stroke="url(#so-fav-blue)"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 6. High-Frequency Central Telemetry Spike -->
  <path
    d="M13.5 18 L16.5 14 L19.5 22 L22.5 18"
    stroke="#ffffff"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#so-fav-glow)"
  />

  <!-- 7. Central Focal Node Beacon -->
  <circle cx="18" cy="18" r="2.4" fill="#22d3ee" fill-opacity="0.35" />
  <circle cx="18" cy="18" r="1.4" fill="#67e8f9" />
  <circle cx="18" cy="18" r="0.7" fill="#ffffff" />
</svg>
